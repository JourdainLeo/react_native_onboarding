name: CI - Jest Tests

on:
  push:
    branches:
      - init
  pull_request:
    branches:
      - init

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: |
          cd MyNewApp
          yarn install --immutable

      - name: Run tests
        run: |
          cd MyNewApp
          yarn test --ci --watchAll=false

